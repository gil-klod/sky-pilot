<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Pilot — Hangar</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100vh;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #e8f4ff;
        background: radial-gradient(ellipse at 50% 0%, #1a3a5c 0%, #0a1628 55%, #060d18 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
      }

      .back {
        position: absolute;
        top: 1.25rem;
        left: 1.25rem;
        color: #7dd3fc;
        text-decoration: none;
        font-size: 0.9rem;
        opacity: 0.85;
      }

      .back:hover { opacity: 1; }

      header { text-align: center; margin-bottom: 2rem; }

      h1 {
        font-size: clamp(2rem, 5vw, 2.8rem);
        font-weight: 700;
        letter-spacing: 0.06em;
        background: linear-gradient(135deg, #7dd3fc, #38bdf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .tagline {
        margin-top: 0.4rem;
        opacity: 0.7;
        font-size: 1rem;
      }

      .panel {
        width: 100%;
        max-width: 720px;
        padding: 2rem;
        border-radius: 16px;
        border: 1px solid rgba(56, 189, 248, 0.25);
        background: rgba(8, 20, 38, 0.9);
      }

      .planes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }

      @media (max-width: 520px) {
        .planes { grid-template-columns: 1fr; }
      }

      .plane-btn {
        padding: 1.25rem;
        border-radius: 12px;
        border: 2px solid rgba(56, 189, 248, 0.25);
        background: rgba(12, 28, 48, 0.8);
        color: inherit;
        cursor: pointer;
        text-align: left;
        transition: border-color 0.2s, background 0.2s;
      }

      .plane-btn:hover {
        border-color: rgba(56, 189, 248, 0.5);
      }

      .plane-btn.selected {
        border-color: #38bdf8;
        background: rgba(18, 45, 75, 0.95);
      }

      .plane-btn strong {
        display: block;
        font-size: 1.1rem;
        margin-bottom: 0.25rem;
      }

      .plane-btn span {
        font-size: 0.85rem;
        opacity: 0.7;
      }

      .options {
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
        margin-bottom: 1.5rem;
      }

      label.row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 0.95rem;
        cursor: pointer;
      }

      .size-row {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .size-row input[type="range"] {
        flex: 1;
        accent-color: #38bdf8;
      }

      .size-row output {
        min-width: 3.5rem;
        font-size: 0.9rem;
        opacity: 0.85;
      }

      .fly-btn {
        display: block;
        width: 100%;
        padding: 1rem;
        border: none;
        border-radius: 10px;
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #0a1628;
        background: linear-gradient(135deg, #7dd3fc, #38bdf8);
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
      }

      .fly-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 24px rgba(56, 189, 248, 0.35);
      }

      .note {
        margin-top: 1.25rem;
        text-align: center;
        font-size: 0.78rem;
        opacity: 0.45;
        line-height: 1.5;
      }

      .note a { color: #7dd3fc; }
    </style>
  </head>
  <body>
    <a class="back" href="/">← All games</a>

    <header>
      <h1>SKY PILOT HANGAR</h1>
      <p class="tagline">Pick your airliner, then fly on a separate page</p>
    </header>

    <div class="panel">
      <div class="planes">
        <button type="button" class="plane-btn selected" data-plane="b744">
          <strong>Boeing 747-400</strong>
          <span>Four-engine queen of the skies</span>
        </button>
        <button type="button" class="plane-btn" data-plane="a380">
          <strong>Airbus A380</strong>
          <span>Double-deck superjumbo</span>
        </button>
      </div>

      <div class="options">
        <label class="row">
          <input type="checkbox" id="easy" checked />
          Easy mode (auto-level assist)
        </label>
        <label class="row">
          <input type="checkbox" id="glitch" />
          Glitch mode (broken planes — just for fun!)
        </label>
        <div class="size-row">
          <label for="size">Plane size</label>
          <input type="range" id="size" min="50" max="100" step="5" value="100" />
          <output id="sizeOut">100%</output>
        </div>
      </div>

      <button type="button" class="fly-btn" id="flyBtn">Fly Boeing 747-400</button>

      <p class="note">
        First load downloads the 3D engine (~8 MB). Aircraft models ©
        <a href="https://www.flightradar24.com" target="_blank" rel="noopener">Flightradar24</a> (GPLv2).
      </p>
    </div>

    <script>
      const planes = document.querySelectorAll(".plane-btn");
      const flyBtn = document.getElementById("flyBtn");
      const easy = document.getElementById("easy");
      const glitch = document.getElementById("glitch");
      const size = document.getElementById("size");
      const sizeOut = document.getElementById("sizeOut");

      let selected = "b744";

      const names = {
        b744: "Boeing 747-400",
        a380: "Airbus A380",
      };

      planes.forEach((btn) => {
        btn.addEventListener("click", () => {
          selected = btn.dataset.plane;
          planes.forEach((b) => b.classList.toggle("selected", b === btn));
          flyBtn.textContent = "Fly " + names[selected];
        });
      });

      size.addEventListener("input", () => {
        sizeOut.textContent = size.value + "%";
      });

      flyBtn.addEventListener("click", () => {
        const params = new URLSearchParams({
          plane: selected,
          easy: easy.checked ? "1" : "0",
          glitch: glitch.checked ? "1" : "0",
          size: (parseInt(size.value, 10) / 100).toFixed(2),
        });
        window.location.href = "/sim/fly/?" + params.toString();
      });
    </script>
  </body>
</html>
